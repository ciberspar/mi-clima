[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clima-g"
version = "1.34.0"
description = "Clima G Desktop - Aplicación meteorológica multiplataforma"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.7,<7",
    "requests>=2.32,<3"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pyinstaller>=6,<7"
]

[project.scripts]
clima-g = "clima_g.app:main"
bacus-alerts = "clima_g.bacus_alerts_daemon:main"

[tool.setuptools.packages.find]
where = ["src"]
