name: 🐢 Baco Report Global (Sectores & Push)

on:
  schedule:
    - cron: '0 8 * * *' # Corre todos los días a las 08:00 UTC
  workflow_dispatch:

jobs:
  generar-reporte-global:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ⚙️ Ejecutar escaneo imperial y enviar Push por ntfy
        run: |
          python3 -c "
          import json
          import urllib.request
          from datetime import datetime

          # Tópico configurado en tu app ntfy
          NTFY_TOPIC = 'climag_baco_gero_882'

          # Sectores clave para el informe diario
          sectores = [
              {'lugar': 'Córdoba (Base Central)', 'lat': -31.42, 'lon': -64.18},
              {'lugar': 'Villa Carlos Paz', 'lat': -31.41, 'lon': -64.49}
          ]

          reportes_por_sector = []
          mensajes_notificacion = []

          for sec in sectores:
              lat, lon, lugar = sec['lat'], sec['lon'], sec['lugar']
              url = f'https://api.open-meteo.com/v1/forecast?latitude={lat}&longitude={lon}&current=temperature_2m,weather_code,uv_index&daily=uv_index_max'
              try:
                  req = urllib.request.urlopen(url)
                  data = json.loads(req.read().decode())
                  temp = data['current']['temperature_2m']
                  code = data['current']['weather_code']
                  uv = data['current']['uv_index_max'][0] if 'daily' in data and data['daily'].get('uv_index_max') else 5
              except Exception:
                  temp, code, uv = 20, 0, 5

              if code in [51,53,55,61,63,65,80,81,82,95,96,99]:
                  estado = 'Refugio Acorazado (Lluvia/Tormenta)'
                  emoji = '🌧️🐢'
              elif temp >= 23:
                  estado = 'Absorción Solar Máxima (Balcón apto)'
                  emoji = '☀️🐢'
              elif temp < 15:
                  estado = 'Hibernación Táctica (Fresco)'
                  emoji = '❄️🐢'
              else:
                  estado = 'Patrulla de Balcón'
                  emoji = '🚶‍♂️🐢'

              reportes_por_sector.append({
                  'lugar': lugar,
                  'temperatura_actual': temp,
                  'decreto_baco': estado,
                  'icono': emoji
              })

              mensajes_notificacion.append(f'{emoji} {lugar}: {temp}°C - {estado}')

          # Guardar el JSON en la raíz del proyecto
          reporte_global = {
              'fecha_actualizacion': datetime.utcnow().strftime('%Y-%m-%d %H:%M:%S UTC'),
              'emperador': 'Baco 🐢',
              'sectores': reportes_por_sector
          }
          with open('baco-report.json', 'w', encoding='utf-8') as f:
              json.dump(reporte_global, f, ensure_ascii=False, indent=2)

          # ENVIAR RESUMEN MATUTINO A NTFY
          cuerpo_notificacion = '\n'.join(mensajes_notificacion)
          req_push = urllib.request.Request(
              f'https://ntfy.sh/{NTFY_TOPIC}',
              data=cuerpo_notificacion.encode('utf-8'),
              headers={
                  'Title': '🐢 Decreto Diario de Baco - Clima G',
                  'Priority': 'default',
                  'Tags': 'turtle,partly_sunny'
              }
          )
          try:
              urllib.request.urlopen(req_push)
              print('¡Notificación Push enviada por ntfy con éxito!')
          except Exception as e:
              print('Error enviando push:', e)
          "

      - name: 🚀 Commit y Push automático
        run: |
          git config --global user.name "Baco Bot Imperial"
          git config --global user.email "baco-bot@users.noreply.github.com"
          git add baco-report.json
          git commit -m "🐢 Actualización automática y envío de notificación Push" || exit 0
          git push
