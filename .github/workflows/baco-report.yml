
name: 🐢 Baco Report

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baco-report
  cancel-in-progress: false

jobs:
  generar-informe:
    name: Generar informe meteorológico
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Obtener datos meteorológicos reales
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          sectores = {
              "Cordoba": {
                  "latitude": -31.4201,
                  "longitude": -64.1888
              },
              "Villa Carlos Paz": {
                  "latitude": -31.4241,
                  "longitude": -64.4978
              }
          }

          informe = {
              "actualizado": datetime.now(timezone.utc).isoformat(),
              "fuente": "Open-Meteo",
              "sectores": {}
          }

          for nombre, ubicacion in sectores.items():
              parametros = (
                  f"latitude={ubicacion['latitude']}"
                  f"&longitude={ubicacion['longitude']}"
                  "&current=temperature_2m,relative_humidity_2m,"
                  "apparent_temperature,precipitation,rain,"
                  "weather_code,wind_speed_10m,wind_gusts_10m"
                  "&timezone=America%2FArgentina%2FCordoba"
              )

              url = "https://api.open-meteo.com/v1/forecast?" + parametros
              solicitud = urllib.request.Request(
                  url,
                  headers={"User-Agent": "ClimaG-BacoReport/1.0"}
              )

              with urllib.request.urlopen(solicitud, timeout=20) as respuesta:
                  datos = json.loads(respuesta.read().decode("utf-8"))

              actual = datos.get("current")

              if not actual:
                  raise RuntimeError(
                      f"Open-Meteo no devolvió datos actuales para {nombre}"
                  )

              informe["sectores"][nombre] = {
                  "temperatura": actual["temperature_2m"],
                  "sensacion_termica": actual["apparent_temperature"],
                  "humedad": actual["relative_humidity_2m"],
                  "precipitacion": actual["precipitation"],
                  "lluvia": actual["rain"],
                  "codigo_tiempo": actual["weather_code"],
                  "viento": actual["wind_speed_10m"],
                  "rafagas": actual["wind_gusts_10m"]
              }

          destino = Path("baco-report.json")
          temporal = destino.with_suffix(".json.tmp")

          temporal.write_text(
              json.dumps(informe, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          temporal.replace(destino)

          print("Informe meteorológico generado correctamente.")
          PY

      - name: Guardar informe si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add baco-report.json

          if git diff --cached --quiet; then
            echo "El informe no cambió. No hace falta crear un commit."
          else
            git commit -m "🐢 Actualizar informe meteorológico de Baco"
            git push
          fi
