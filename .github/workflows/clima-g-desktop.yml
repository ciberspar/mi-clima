
name: Clima G Desktop - CI and Multi-platform Build

on:
  push:
    branches:
      - main
      - pruebas
    paths:
      - "clima en python/**"
      - ".github/workflows/clima-g-desktop.yml"
  pull_request:
    branches:
      - main
    paths:
      - "clima en python/**"
      - ".github/workflows/clima-g-desktop.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: clima-g-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PROJECT_DIR: "clima en python"

jobs:
  test:
    name: Tests - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-latest

    defaults:
      run:
        working-directory: clima en python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: "clima en python/pyproject.toml"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check Python syntax
        run: |
          python -m compileall -q src tests

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q

      - name: Build Python package
        run: |
          python -m pip install build
          python -m build

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-${{ runner.os }}
          path: |
            clima en python/dist/*
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build desktop - ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
              name: windows
          - os: ubuntu-24.04
              name: linux
          - os: macos-latest
              name: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0

      - name: Install application
        working-directory: clima en python
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build Windows executable
        if: runner.os == 'Windows'
        working-directory: clima en python
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed `
            --name "Clima G" `
            --collect-all PyQt6 `
            --collect-all clima_g `
            -m clima_g.app

      - name: Build Linux executable
        if: runner.os == 'Linux'
        working-directory: clima en python
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name "Clima-G" \
            --collect-all PyQt6 \
            --collect-all clima_g \
            -m clima_g.app

      - name: Build macOS application
        if: runner.os == 'macOS'
        working-directory: clima en python
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name "Clima G" \
            --collect-all PyQt6 \
            --collect-all clima_g \
            -m clima_g.app

      - name: Upload desktop application
        uses: actions/upload-artifact@v4
        with:
          name: clima-g-${{ matrix.os }}
          path: |
            clima en python/dist/
          if-no-files-found: error
          retention-days: 14

  linux-packages:
    name: Linux package preparation
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: clima-g-ubuntu-24.04
          path: linux-build

      - name: Prepare portable archive
        run: |
          mkdir -p packages
          tar -czf packages/clima-g-linux-x86_64.tar.gz \
            -C linux-build .

      - name: Upload Linux archive
        uses: actions/upload-artifact@v4
        with:
          name: clima-g-linux-portable
          path: packages/*.tar.gz
          if-no-files-found: error
          retention-days: 14
