
name: Clima G - Desktop Installers

on:
  push:
    branches:
      - main
      - pruebas
    paths:
      - "clima en python/**"
      - ".github/workflows/clima-g-desktop.yml"

  pull_request:
    branches:
      - main
    paths:
      - "clima en python/**"
      - ".github/workflows/clima-g-desktop.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clima-g-installers-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  APP_VERSION: "1.34.0"
  APP_NAME: "Clima G"
  APP_VENDOR: "Clima G"
  APP_URL: "https://github.com/ciberspar/mi-clima"

jobs:

  # =====================================================
  # 1. TESTS MULTIPLATAFORMA
  # =====================================================

  test:
    name: Tests - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-latest

    defaults:
      run:
        working-directory: clima en python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check Python syntax
        run: |
          python -m compileall -q src tests

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q

  # =====================================================
  # 2. WINDOWS - SETUP.EXE
  # =====================================================

  windows:
    name: Windows - Clima-G-Setup.exe
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Clima G and PyInstaller
        working-directory: clima en python
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install "pyinstaller>=6,<7"

      - name: Create launcher
        working-directory: clima en python
        shell: bash
        run: |
          printf '%s\n' \
            'from clima_g.app import main' \
            'if __name__ == "__main__":' \
            '    raise SystemExit(main())' \
            > clima_g_launcher.py

      - name: Build Windows application
        working-directory: clima en python
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed `
            --name "Clima G" `
            --collect-all clima_g `
            clima_g_launcher.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Compile Windows installer
        shell: pwsh
        run: |
          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )

          $iscc = $isccCandidates |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (!$iscc) {
            throw "No se encontró ISCC.exe."
          }

          $projectDir = Join-Path $env:GITHUB_WORKSPACE "clima en python"
          $sourceDir = Join-Path $projectDir "dist\Clima G"
          $issDir = Join-Path $projectDir "installer\windows"
          $script = Join-Path $issDir "ClimaG.iss"

          if (!(Test-Path $sourceDir)) {
            throw "No se encontró la aplicación: $sourceDir"
          }

          if (!(Test-Path $script)) {
            throw "No se encontró el script: $script"
          }

          if (!(Test-Path (Join-Path $sourceDir "Clima G.exe"))) {
            throw "No se encontró Clima G.exe."
          }

          Write-Host "Inno Setup: $iscc"
          Write-Host "Aplicación: $sourceDir"
          Write-Host "Script: $script"

          Push-Location $issDir

          try {
            & $iscc "/DSourceDir=$sourceDir" "ClimaG.iss"

            if ($LASTEXITCODE -ne 0) {
              throw "Falló la compilación de Inno Setup."
            }
          }
          finally {
            Pop-Location
          }

          $setup = Join-Path $issDir "output\Clima-G-Setup.exe"

          if (!(Test-Path $setup)) {
            throw "No se generó Clima-G-Setup.exe."
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Clima-G-Windows-Setup
          path: clima en python/installer/windows/output/Clima-G-Setup.exe
          if-no-files-found: error
          retention-days: 30

  # =====================================================
  # 3. LINUX - DEB
  # =====================================================

  linux:
    name: Linux - DEB
    needs: test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            ruby \
            ruby-dev \
            build-essential

      - name: Install Clima G and PyInstaller
        working-directory: clima en python
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install "pyinstaller>=6,<7"

      - name: Create launcher
        working-directory: clima en python
        shell: bash
        run: |
          printf '%s\n' \
            'from clima_g.app import main' \
            'if __name__ == "__main__":' \
            '    raise SystemExit(main())' \
            > clima_g_launcher.py

      - name: Build Linux application
        working-directory: clima en python
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name "Clima-G" \
            --collect-all clima_g \
            clima_g_launcher.py

      - name: Install FPM
        run: |
          sudo gem install --no-document fpm

      - name: Prepare Debian package
        shell: bash
        run: |
          set -e

          PROJECT="clima en python"
          ROOT="debian-package"

          mkdir -p "$ROOT/opt/clima-g"
          mkdir -p "$ROOT/usr/bin"
          mkdir -p "$ROOT/usr/share/applications"

          cp -a "$PROJECT/dist/Clima-G/." "$ROOT/opt/clima-g/"

          cat > "$ROOT/usr/bin/clima-g" <<'EOF'
          #!/bin/sh
          exec /opt/clima-g/Clima-G "$@"
          EOF

          chmod 755 "$ROOT/usr/bin/clima-g"

          cat > "$ROOT/usr/share/applications/clima-g.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Clima G
          GenericName=Aplicación meteorológica
          Comment=Consulta el tiempo y recibe alertas meteorológicas con Clima G
          Exec=clima-g
          Terminal=false
          Categories=Utility;Weather;
          StartupNotify=true
          EOF

      - name: Build DEB package with metadata
        shell: bash
        run: |
          set -e

          fpm \
            --input-type dir \
            --output-type deb \
            --name "clima-g" \
            --version "$APP_VERSION" \
            --architecture amd64 \
            --description "Clima G Desktop: aplicación meteorológica de escritorio para consultar el tiempo y recibir alertas meteorológicas." \
            --maintainer "Clima G" \
            --vendor "Clima G" \
            --url "$APP_URL" \
            --license "MIT" \
            --category "Utility" \
            --depends libglib2.0-0 \
            --depends libgl1 \
            --depends libegl1 \
            --depends libxkbcommon0 \
            --depends libdbus-1-3 \
            --package "clima-g_${APP_VERSION}_amd64.deb" \
            debian-package/opt \
            debian-package/usr

          test -f "clima-g_${APP_VERSION}_amd64.deb"

          dpkg-deb --info "clima-g_${APP_VERSION}_amd64.deb"
          dpkg-deb --contents "clima-g_${APP_VERSION}_amd64.deb"

      - name: Upload Linux installer
        uses: actions/upload-artifact@v4
        with:
          name: Clima-G-Linux-DEB
          path: clima-g_${{ env.APP_VERSION }}_amd64.deb
          if-no-files-found: error
          retention-days: 30

  # =====================================================
  # 4. MACOS - DMG
  # =====================================================

  macos:
    name: macOS - DMG
    needs: test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Clima G and PyInstaller
        working-directory: clima en python
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install "pyinstaller>=6,<7"

      - name: Create launcher
        working-directory: clima en python
        shell: bash
        run: |
          printf '%s\n' \
            'from clima_g.app import main' \
            'if __name__ == "__main__":' \
            '    raise SystemExit(main())' \
            > clima_g_launcher.py

      - name: Build macOS application
        working-directory: clima en python
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name "Clima G" \
            --collect-all clima_g \
            clima_g_launcher.py

      - name: Create DMG
        working-directory: clima en python
        run: |
          set -e

          test -d "dist/Clima G.app"

          hdiutil create \
            -volname "Clima G" \
            -srcfolder "dist/Clima G.app" \
            -ov \
            -format UDZO \
            "dist/Clima-G.dmg"

          test -f "dist/Clima-G.dmg"

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: Clima-G-macOS-DMG
          path: clima en python/dist/Clima-G.dmg
          if-no-files-found: error
          retention-days: 30
