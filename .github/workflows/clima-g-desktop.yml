
name: Clima G Desktop - CI and Multi-platform Build

on:
  push:
    branches:
      - main
      - pruebas
    paths:
      - "clima en python/**"
      - "installer/windows/**"
      - ".github/workflows/clima-g-desktop.yml"

  pull_request:
    branches:
      - main
    paths:
      - "clima en python/**"
      - "installer/windows/**"
      - ".github/workflows/clima-g-desktop.yml"

  workflow_dispatch:

  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: clima-g-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:

  # =====================================================
  # 1. TESTS MULTIPLATAFORMA
  # =====================================================

  test:
    name: Tests - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-latest

    defaults:
      run:
        working-directory: clima en python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: "clima en python/pyproject.toml"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check Python syntax
        run: |
          python -m compileall -q src tests

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q

      - name: Build Python distributions
        run: |
          python -m pip install build
          python -m build

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: clima-g-python-${{ runner.os }}
          path: clima en python/dist/*
          if-no-files-found: error
          retention-days: 14

  # =====================================================
  # 2. APLICACIÓN DE ESCRITORIO
  # =====================================================

  build:
    name: Desktop - ${{ matrix.platform_name }}
    needs: test
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_name: windows

          - os: ubuntu-24.04
            platform_name: linux

          - os: macos-latest
            platform_name: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0

      - name: Install Clima G
        working-directory: clima en python
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Install PyInstaller
        run: |
          python -m pip install "pyinstaller>=6,<7"

      - name: Create temporary launcher
        working-directory: clima en python
        shell: bash
        run: |
          printf '%s\n' \
            'from clima_g.app import main' \
            'if __name__ == "__main__":' \
            '    raise SystemExit(main())' \
            > clima_g_launcher.py

      # Windows
      - name: Build Windows executable
        if: runner.os == 'Windows'
        working-directory: clima en python
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed `
            --name "Clima G" `
            --collect-all clima_g `
            clima_g_launcher.py

      # Linux
      - name: Build Linux executable
        if: runner.os == 'Linux'
        working-directory: clima en python
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name "Clima-G" \
            --collect-all clima_g \
            clima_g_launcher.py

      # macOS
      - name: Build macOS application
        if: runner.os == 'macOS'
        working-directory: clima en python
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name "Clima G" \
            --collect-all clima_g \
            clima_g_launcher.py

      - name: Upload desktop application
        uses: actions/upload-artifact@v4
        with:
          name: clima-g-${{ matrix.platform_name }}
          path: clima en python/dist/
          if-no-files-found: error
          retention-days: 14

  # =====================================================
  # 3. INSTALADOR WINDOWS
  # =====================================================

  windows-installer:
    name: Windows Setup.exe
    needs: build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows application
        uses: actions/download-artifact@v4
        with:
          name: clima-g-windows
          path: windows-build

      - name: Inspect Windows application
        shell: pwsh
        run: |
          Write-Host "Contenido del artefacto descargado:"
          Get-ChildItem "windows-build" -Recurse

          $exe = Get-ChildItem `
            -Path "windows-build" `
            -Filter "Clima G.exe" `
            -File `
            -Recurse |
            Select-Object -First 1

          if (!$exe) {
            throw "No se encontró Clima G.exe en el artefacto descargado."
          }

          Write-Host "Ejecutable encontrado: $($exe.FullName)"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )

          $iscc = $isccCandidates |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (!$iscc) {
            $iscc = Get-ChildItem `
              -Path "$env:ProgramFiles(x86)", "$env:ProgramFiles" `
              -Filter "ISCC.exe" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (!$iscc) {
            throw "No se encontró ISCC.exe. Inno Setup no está instalado correctamente."
          }

          Write-Host "Inno Setup: $iscc"

          $exe = Get-ChildItem `
            -Path "windows-build" `
            -Filter "Clima G.exe" `
            -File `
            -Recurse |
            Select-Object -First 1

          if (!$exe) {
            throw "No se encontró Clima G.exe."
          }

          $sourceDir = $exe.Directory.FullName
          $script = Join-Path $env:GITHUB_WORKSPACE "installer\windows\ClimaG.iss"

          if (!(Test-Path $sourceDir)) {
            throw "No existe la carpeta de la aplicación: $sourceDir"
          }

          if (!(Test-Path $script)) {
            throw "No se encontró el script de Inno Setup: $script"
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "installer\windows\output" |
            Out-Null

          Write-Host "Carpeta de Clima G: $sourceDir"
          Write-Host "Script del instalador: $script"

          & $iscc "/DSourceDir=$sourceDir" $script

          if ($LASTEXITCODE -ne 0) {
            throw "Falló la compilación del instalador."
          }

          $setup = "installer\windows\output\Clima-G-Setup.exe"

          if (!(Test-Path $setup)) {
            throw "Inno Setup terminó sin generar Clima-G-Setup.exe."
          }

          Write-Host "Instalador generado correctamente."

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: clima-g-windows-installer
          path: installer/windows/output/Clima-G-Setup.exe
          if-no-files-found: error
          retention-days: 30

  # =====================================================
  # 4. PAQUETE PORTÁTIL LINUX
  # =====================================================

  linux-packages:
    name: Linux portable package
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: clima-g-linux
          path: linux-build

      - name: Prepare portable archive
        run: |
          mkdir -p packages

          tar -czf packages/clima-g-linux-x86_64.tar.gz \
            -C linux-build .

      - name: Upload Linux portable package
        uses: actions/upload-artifact@v4
        with:
          name: clima-g-linux-portable
          path: packages/*.tar.gz
          if-no-files-found: error
          retention-days: 14
