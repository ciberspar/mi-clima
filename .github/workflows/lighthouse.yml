name: Lighthouse CI

on:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Run Lighthouse Audit
        run: |
          # Opción A: Si auditas tu sitio ya desplegado en GitHub Pages (suele requerir una URL directa al archivo index.html dentro de docs o la raíz configurada en Pages)
          # Si GitHub Pages sirve desde /docs, la URL sigue siendo la misma, pero asegúrate de que los cambios ya se hayan publicado.
          
          lhci collect --url=https://ciberspar.github.io/mi-clima/
          
          # Opción B (Alternativa recomendada si quieres auditar directamente la carpeta docs localmente antes de publicar):
          # lhci collect --static-dist-dir=docs

      - name: Save and Commit Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .lighthouseci/
          git commit -m "chore: actualiza reporte de Lighthouse CI [skip ci]" || echo "No hay cambios nuevos en los reportes"
          git push
