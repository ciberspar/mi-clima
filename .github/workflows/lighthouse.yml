name: Lighthouse CI

on:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Run Lighthouse Audit
        run: |
          # Audita directamente la carpeta docs localmente antes de publicar
          lhci collect --static-dist-dir=docs

      - name: Save and Commit Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .lighthouseci/
          git commit -m "chore: actualiza reporte de Lighthouse CI [skip ci]" || echo "No hay cambios nuevos en los reportes"
          
          # Sincroniza con el repositorio remoto antes de empujar para evitar conflictos
          git pull origin main --rebase || echo "No hubo conflictos en el pull"
          
          git push
