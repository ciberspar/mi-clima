
name: 🔎 Lighthouse - Rendimiento Clima G

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Auditar página web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Comprobar página principal
        run: |
          test -f docs/index.html
          echo "Página principal encontrada."

      - name: Instalar Lighthouse CI
        run: npm install --global @lhci/cli@0.15.x

      - name: Ejecutar auditoría
        run: |
          lhci collect \
            --staticDistDir=docs \
            --numberOfRuns=1 \
            --maxAutodiscoverUrls=10 \
            --staticDirFileDiscoveryDepth=4

      - name: Guardar informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          if-no-files-found: warn
          retention-days: 30
