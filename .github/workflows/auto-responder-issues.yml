
name: 🤖 Auto-responder de Issues

on:
  issues:
    types:
      - opened

permissions:
  issues: write

concurrency:
  group: issue-responder-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  responder:
    name: Responder nuevo Issue
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Enviar respuesta automática
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;

            if (!issue) {
              core.setFailed("No se encontró el Issue.");
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: [
                "¡Gracias por comunicarte con Clima G! 🐢🌦️",
                "",
                "Tu Issue fue recibido correctamente.",
                "Nuestro equipo revisará tu reporte o sugerencia.",
                "",
                "¡Gracias por ayudar a mejorar Clima G!"
              ].join("\n")
            });

            console.log(`Respuesta enviada al Issue #${issue.number}.`);
