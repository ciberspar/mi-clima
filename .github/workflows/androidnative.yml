
name: Clima G Android Native

on:
  push:
    branches:
      - main
      - pruebas
    paths:
      - "android/**"
      - ".github/workflows/android-native.yml"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Clima G
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Diagnose project structure
        working-directory: android
        run: |
          echo "===== DIRECTORY ====="
          pwd

          echo "===== FILES ====="
          find . -maxdepth 7 -type f | sort

          echo "===== SETTINGS ====="
          cat settings.gradle.kts

          echo "===== ROOT BUILD ====="
          cat build.gradle.kts

          echo "===== APP BUILD ====="
          cat app/build.gradle.kts

      - name: Diagnose Gradle projects
        working-directory: android
        run: |
          gradle projects --stacktrace

      - name: List Gradle tasks
        working-directory: android
        run: |
          gradle tasks --all

      - name: Build debug APK
        working-directory: android
        run: |
          gradle :app:assembleDebug -Pandroid.useAndroidX=true --stacktrace

      - name: Upload Clima G APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Clima-G-Android-0.1.0
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
