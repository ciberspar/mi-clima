
name: Clima G Android Native

on:
  push:
    branches:
      - main
      - pruebas
    paths:
      - "android/**"
      - ".github/workflows/androidnative.yml"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Clima G
    runs-on: ubuntu-latest

    env:
      CLIMAG_KEYSTORE_PATH: ${{ github.workspace }}/android/app/climag-release.jks
      CLIMAG_STORE_PASSWORD: ${{ secrets.CLIMAG_STORE_PASSWORD }}
      CLIMAG_KEY_ALIAS: ${{ secrets.CLIMAG_KEY_ALIAS }}
      CLIMAG_KEY_PASSWORD: ${{ secrets.CLIMAG_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Check Android tools
        run: |
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Diagnose project
        working-directory: android
        run: |
          echo "===== FILES ====="
          find . -maxdepth 7 -type f | sort

          echo "===== SETTINGS ====="
          cat settings.gradle.kts

          echo "===== APP BUILD ====="
          cat app/build.gradle.kts

      - name: Build Debug APK
        working-directory: android
        run: |
          gradle :app:assembleDebug \
            -Pandroid.useAndroidX=true \
            --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Clima-G-Android-0.2.0-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Validate signing secrets
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLIMAG_KEYSTORE_BASE64: ${{ secrets.CLIMAG_KEYSTORE_BASE64 }}
        run: |
          test -n "$CLIMAG_KEYSTORE_BASE64"
          test -n "$CLIMAG_STORE_PASSWORD"
          test -n "$CLIMAG_KEY_ALIAS"
          test -n "$CLIMAG_KEY_PASSWORD"

      - name: Restore release keystore
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLIMAG_KEYSTORE_BASE64: ${{ secrets.CLIMAG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$(dirname "$CLIMAG_KEYSTORE_PATH")"

          printf '%s' "$CLIMAG_KEYSTORE_BASE64" \
            | base64 --decode > "$CLIMAG_KEYSTORE_PATH"

          chmod 600 "$CLIMAG_KEYSTORE_PATH"
          test -s "$CLIMAG_KEYSTORE_PATH"

      - name: Build signed Release APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: android
        run: |
          gradle :app:assembleRelease \
            -Pandroid.useAndroidX=true \
            --stacktrace

      - name: Verify APK signature
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Remove temporary keystore
        if: always()
        run: |
          rm -f android/app/climag-release.jks

      - name: Upload signed Release APK
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Clima-G-Android-0.2.0-Release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
