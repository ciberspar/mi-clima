name: Testear Web del Clima

# Se ejecuta cada vez que hacés push o abris un pull request
on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Descarga el código actual de tu repositorio
    - name: Copiar repositorio
      uses: actions/checkout@v4

    # 2. (Opcional) Si tu proyecto usa Node.js y tenés tests configurados con npm
    # - name: Configurar Node.js
    #   uses: actions/setup-node@v4
    #   with:
    #   node-version: '18'
    # - name: Instalar dependencias y correr tests
    #   run: |
    #     npm install
    #     npm test

    # 3. Validación básica de estructura (comprueba que los archivos principales existan)
    - name: Verificar archivos esenciales
      run: |
        if [ ! -f "index.html" ]; then
          echo "Error: No se encontró el archivo index.html"
          exit 1
        fi
        echo "¡Estructura básica verificada correctamente!"
