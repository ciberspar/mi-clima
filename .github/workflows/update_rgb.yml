
name: Validar Clima G RGB

on:
  push:
    paths:
      - "scripts/generar_rgb.py"
      - ".github/workflows/update_rgb.yml"
  pull_request:
    paths:
      - "scripts/generar_rgb.py"
      - ".github/workflows/update_rgb.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar sintaxis
        run: python -m py_compile scripts/generar_rgb.py

      - name: Ejecutar autopruebas
        run: python scripts/generar_rgb.py --self-test

