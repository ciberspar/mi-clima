name: Actualizar RGB Clima G
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/generar_rgb.py
      - run: |
          git config user.name "Clima G Bot"
          git config user.email "bot@climag.duckdns.org"
          git add rgb.json
          git commit -m "Actualizar rgb.json" || exit 0
          git push
