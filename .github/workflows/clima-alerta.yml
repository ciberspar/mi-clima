name: Revisar Clima y Alertas

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: 

jobs:
  verificar-clima:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio para leer la ubicación actual
        uses: actions/checkout@v4

      - name: Verificar clima y enviar notificación push
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: |
          # Lee la ubicación dinámica desde el archivo de tu web, o usa valores por defecto si no hay registro
          LAT="-31.42"
          LON="-64.18"
          LUGAR="tu ubicación actual"
          
          if [ -f "ubicacion.json" ]; then
            LAT=$(jq -r '.lat' ubicacion.json)
            LON=$(jq -r '.lon' ubicacion.json)
            LUGAR=$(jq -r '.lugar' ubicacion.json)
          fi

          # Consulta el clima en Open-Meteo usando la ubicación detectada
          RESPONSE=$(curl -s "https://api.open-meteo.com/v1/forecast?latitude=$LAT&longitude=$LON&current=temperature_2m,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=America%2FArgentina%2FCordoba")
          
          TEMP_ACTUAL=$(echo $RESPONSE | jq '.current.temperature_2m | round')
          WEATHER_CODE=$(echo $RESPONSE | jq '.current.weather_code')
          WIND_SPEED=$(echo $RESPONSE | jq '.current.wind_speed_10m | round')
          
          TEMP_MAX=$(echo $RESPONSE | jq '.daily.temperature_2m_max[0] | round')
          TEMP_MIN=$(echo $RESPONSE | jq '.daily.temperature_2m_min[0] | round')

          HORA_ARG=$(date -u -d '3 hours ago' +%H)
          MINUTO_ARG=$(date -u -d '3 hours ago' +%M)

          # 1. RESUMEN DIARIO DE TEMPERATURA (A las 09:00 AM, fuera de la noche)
          if [ "$HORA_ARG" -eq 9 ] && [ "$MINUTO_ARG" -lt 20 ]; then
            curl --location 'https://onesignal.com/api/v1/notifications' \
            --header "Authorization: Key $ONESIGNAL_API_KEY" \
            --header 'Content-Type: application/json' \
            --data '{
              "app_id": "'"$ONESIGNAL_APP_ID"'",
              "included_segments": ["All"],
              "contents": {"es": "Hoy en '"$LUGAR"' hace '"$TEMP_ACTUAL"'°C (Mín: '"$TEMP_MIN"'°C / Máx: '"$TEMP_MAX"'°C)"},
              "headings": {"es": "🌤️ Clima del Día"}
            }'
          fi

          # 2. ALERTAS DE MAL TIEMPO (Cada 20 minutos)
          MENSAJE_ALERTA=""
          if [ "$WEATHER_CODE" -eq 95 ] || [ "$WEATHER_CODE" -eq 96 ] || [ "$WEATHER_CODE" -eq 99 ]; then
            MENSAJE_ALERTA="⚠️ Tormenta eléctrica en '"$LUGAR"'. Hace $TEMP_ACTUAL°C"
          elif [ "$WEATHER_CODE" -ge 61 ] && [ "$WEATHER_CODE" -le 65 ]; then
            MENSAJE_ALERTA="🌧️ Lluvia activa en '"$LUGAR"'. Hace $TEMP_ACTUAL°C"
          elif [ $(echo "$WIND_SPEED > 50" | bc) -eq 1 ]; then
            MENSAJE_ALERTA="🌬️ Vientos fuertes de $WIND_SPEED km/h en '"$LUGAR"'. Hace $TEMP_ACTUAL°C"
          fi

          if [ -n "$MENSAJE_ALERTA" ]; then
            curl --location 'https://onesignal.com/api/v1/notifications' \
            --header "Authorization: Key $ONESIGNAL_API_KEY" \
            --header 'Content-Type: application/json' \
            --data '{
              "app_id": "'"$ONESIGNAL_APP_ID"'",
              "included_segments": ["All"],
              "contents": {"es": "'"$MENSAJE_ALERTA"'"},
              "headings": {"es": "⚠️ Alerta Meteorológica"}
            }'
          fi
