name: Enviar Push Nativo Propio

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: 

jobs:
  disparar-push:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencia web-push
        run: npm install web-push

      - name: Ejecutar script de notificaciones
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node enviar-push.js

      - name: Guardar cambios si se limpiaron suscripciones inactivas
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: Actualizar lista de suscripciones push"
          file_pattern: "suscripciones.json"
