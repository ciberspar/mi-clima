name: 🚀 Monitoreo Web Push y Resumen de Baco

on:
  schedule:
    # Corre cada 20 minutos (minutos 0, 20, 40 de cada hora)
    - cron: '0,20,40 * * * *'
  workflow_dispatch:

jobs:
  enviar-push:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 🌤️ Consultar Clima y Enviar Web Push Nativo
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          node .github/scripts/send-push.js
