name: 🌦️ Clima G - Validación Push y resumen semanal
on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/sw.js"
      - "netlify/functions/subscribe.mjs"
      - "netlify/functions/registrar-datos.mjs"
      - "netlify/functions/alertas.mjs"
      - "netlify/functions/resumen-semanal.mjs"
      - ".github/workflows/clima-alerta.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/sw.js"
      - "netlify/functions/**"
      - ".github/workflows/clima-alerta.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clima-g-push-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check netlify/functions/subscribe.mjs
          node --check netlify/functions/registrar-datos.mjs
          node --check netlify/functions/alertas.mjs
          node --check netlify/functions/resumen-semanal.mjs
          node --check netlify/functions/clima-g-core.mjs
          node --check docs/sw.js
      - name: Verify integrations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          required = {
            "multi-location subscription": ("netlify/functions/subscribe.mjs", "locations"),
            "personalized alerts": ("netlify/functions/alertas.mjs", "device.locations"),
            "weather history": ("netlify/functions/registrar-datos.mjs", "history"),
            "weekly summary retention": ("netlify/functions/resumen-semanal.mjs", "RETENTION=7*DAY"),
            "weekly schedule": ("netlify/functions/resumen-semanal.mjs", 'schedule:"0 * * * *"'),
            "push event": ("docs/sw.js", "addEventListener('push'"),
            "weekly summary UI": ("docs/index.html", "climaGResumenesSemanales"),
          }
          failed=[]
          for label,(file,needle) in required.items():
            ok=needle in Path(file).read_text(encoding="utf-8")
            print(("OK" if ok else "FAIL")+" - "+label)
            if not ok: failed.append(label)
          if failed: raise SystemExit("Failed: "+", ".join(failed))
          PY
