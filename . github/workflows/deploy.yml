name: Desplegar Web del Clima

# Se ejecuta cada vez que subís cambios a la rama main
on:
  push:
    branches: ["main"] # Cambiá a "master" si tu rama principal se llama así

# Permisos necesarios para que GitHub Actions pueda publicar en Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite una sola ejecución simultánea para evitar conflictos
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Subir artefactos (archivos de la web)
        uses: actions/upload-pages-artifact@v3
        with:
          # Indica que toda la carpeta raíz contiene los archivos de la web (index.html, etc.)
          path: '.'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
