<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  
  <!-- Fondo redondeado estilo PWA -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  
  <!-- Sol en la esquina -->
  <circle cx="360" cy="160" r="75" fill="url(#sun)"/>
  
  <!-- Nube brillante detrás/al frente -->
  <path d="M 320 290 A 55 55 0 0 0 215 265 A 45 45 0 0 0 140 310 A 35 35 0 0 0 160 380 L 320 380 A 45 45 0 0 0 320 290 Z" fill="#ffffff" opacity="0.95"/>
  
  <!-- Letra 'G' estilizada en el centro -->
  <text x="210" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="250" fill="#0284c7">G</text>
</svg>
